<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les deux pilules</title>
<style>
/* Polices hébergées avec la page (SIL OFL), sans aucun appel externe. */
@font-face { font-family: "DotGothic16"; src: url("fonts/dotgothic16-latin.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url("fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url("fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-display: swap; }
/* Mise en scène : une seule toile 16:9 plein écran, letterbox sur fond nuit ; HUD discret en bas à droite. */
:root {
  --nuit: #0c0b0d;
  --craie: #f1e9dc;
  --gris: #8f877b;
  --filet: #2b2826;
  --labo: #8fc0d6;
  --joueur: #d7a548;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--nuit); color: var(--craie); overflow: hidden; }
#scene { display: block; width: 100%; height: 100%; object-fit: contain; cursor: pointer; outline: none; }
#scene:focus-visible { box-shadow: inset 0 0 0 2px var(--labo); }
#hud {
  position: fixed; right: 16px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end;
  font: 12px/1 var(--mono); letter-spacing: .08em; color: var(--gris);
  font-variant-numeric: tabular-nums; pointer-events: none;
}
#hud .piste { width: 160px; height: 3px; background: var(--filet); }
#hud .piste div { height: 100%; width: 0; background: var(--craie); }
#hud b { color: var(--craie); font-weight: 500; }
</style>

<canvas id="scene" width="1920" height="1080" tabindex="0" aria-label="Animation interactive : Xphi présente le dilemme des deux pilules, bleue et rouge"></canvas>
<div id="hud"><span id="etape"></span><span id="aide"></span><div class="piste"><div id="prog"></div></div></div>

<script>
(() => {
  // ================================================================ base
  const W = 1920, H = 1080;
  const S = /4k/.test(location.hash) ? 2 : 1;
  const cv = document.getElementById('scene');
  cv.width = W * S; cv.height = H * S;
  const ctx = cv.getContext('2d');

  const CRAIE = '#f1e9dc', GRIS = '#8f877b', NUIT = '#0c0b0d', LABO = '#8fc0d6', LAITON = '#d7a548';
  const BLEU = '#4f86e8', BLEU_TXT = '#6f9cf0', ROUGE = '#d9483b', ROUGE_TXT = '#e2675b', GRIS_FIG = '#a39a8c';
  const MONO = '"IBM Plex Mono", ui-monospace, monospace';
  const PIX = '"DotGothic16", "IBM Plex Mono", monospace';
  const G = '01·:+*#%xφ'.split('');

  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const lerp = (a, b, k) => a + (b - a) * k;
  const eIO = k => (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
  const eOut = k => 1 - Math.pow(1 - k, 3);
  const eIn = k => k * k * k;
  const eBack = k => { const c = 1.70158; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  // un nombre fixe dans [0, 1[ pour chaque entier (le premier tirage de rng(n)) : le hasard du sujet, rejouable, sans rien allouer
  const hache = n => { let t = (n | 0) + 0x6D2B79F5 | 0; t = Math.imul(t ^ t >>> 15, 1 | t); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; };
  const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };

  // Une valeur animée : set(v, t, durée) part de la valeur qu'elle a à l'instant t.
  class V {
    constructor(v) { this.a = v; this.b = v; this.t0 = 0; this.d = 0; }
    set(v, t, d = .8) { this.a = this.get(t); this.b = v; this.t0 = t; this.d = d; }
    get(t) { if (this.d <= 0) return this.b; return lerp(this.a, this.b, eIO(seg(t, this.t0, this.t0 + this.d))); }
  }

  // ================================================================ le sujet : une grille de 11×12 cases, décrite en lettres
  // Une case = 4 px à la taille réelle : 44×48 px, du haut de la coiffe (cy - 24) aux pieds (cy + 24) ; la grille du morceau (pas de 50×62) ne bouge pas.
  // . rien · B le corps (la couleur de sens) · O l'ombre · L la lumière (venue d'en haut, de Phi) · E l'œil, la bouche (la nuit)
  // · G la goutte de sueur (la craie), dans la peur seulement
  // Le corps est un assemblage de calques : jambes, puis corps et bras, puis tête, coiffe, yeux, bouche.
  // Chaque calque est une pose dessinée case par case ; rien n'est copié, tout est donnée.
  const SW = 11, SH = 12, CS = 4;
  const LETTRE = { B: 1, O: 2, L: 3, E: 4, G: 5 };
  const calque = (y0, lignes) => { const out = []; lignes.forEach((l, j) => [...l].forEach((c, x) => { if (LETTRE[c]) out.push([x, y0 + j, LETTRE[c]]); })); return out; };
  const TETE = calque(1, [
    '...LLBBB...',
    '..LBBBBBO..',
    '..BBBBBBO..',
    '..BBBBBBO..',
    '...BBBBO...',
  ]);
  // la lumière vient de Phi : la tête est dessinée en miroir quand Phi est à droite du sujet (un bit de plus dans la clé de l'atlas)
  const miroir = cal => cal.map(([x, y, c]) => [SW - 1 - x, y, c]);
  const TETES = [TETE, miroir(TETE)];          // 0 : lumière à gauche ; 1 : Phi est à droite, la lumière aussi
  // les coiffes : de l'ombre posée sur la tête, pour qu'on ne soit pas cent clones, sans toucher à la couleur de sens
  const COIFFES = [
    [],                                                                     // ras
    calque(0, ['.....O.....']),                                             // épi
    calque(1, ['...OOOOO...', '..O.....O..']),                              // calot
    calque(0, ['....OOO....', '...OOOOO...']),                              // chignon
    calque(1, ['...OOOOO...', '..O.....O..', '..O.....O..', '..O.....O..']), // longs
    calque(1, ['...OOOOO...', '..OOOOOOO..']),                              // frange
    calque(0, ['......OO...', '...OOOOO...', '..OO.......']),               // mèche
  ];
  const ECHARPE = calque(6, ['...OOOOO...']);  // de l'ombre au cou : jamais de couleur hors sens
  const CORPS = {
    bas: calque(6, [        // au repos, bras le long du corps
      '....OBO....',
      '...BBBBB...',
      '..O.BBB.O..',
      '..O.BBB.O..',
    ]),
    hop: calque(6, [        // le saut du choix : les bras s'écartent pour l'équilibre
      '....OBO....',
      '.OOBBBBBOO.',
      '....BBB....',
      '....BBB....',
    ]),
    leves: calque(3, [      // la vie : les bras au ciel
      'O.........O',
      'O.........O',
      '.O.......O.',
      '..O.OBO.O..',
      '...BBBBB...',
      '....BBB....',
      '....BBB....',
    ]),
    serres: calque(6, [     // la peur : les bras collés au corps, raide ; plus de jour entre les bras et le ventre
      '....OBO....',
      '...OBBBO...',
      '...OBBBO...',
      '...OBBBO...',
    ]),
    croises: calque(6, [    // celui qui ne prend rien : les bras croisés, large
      '....OBO....',
      '...BBBBB...',
      '..OOOOOOO..',
      '....BBB....',
    ]),
  };
  const JAMBES = {
    droit: calque(10, ['....O.O....', '...OO.OO...']),
    saut: calque(10, ['...O...O...']),
    serre: calque(10, ['.....O.....', '....O.O....']),
  };

  // une image du sujet, case par case. p : { bras, jambes, yx, yy (le regard, -1..1), yeux ('o' ouverts, 'f' fermés, 'g' grands),
  //   bouche (0, 1 un « o », 2 le rire), goutte (0, ou 1..2 : la goutte qui glisse le long de la tempe), bob (la tête descend d'une case : l'expiration), acc (tout le haut descend : accroupi), coiffe,
  //   detail (1 : l'écharpe), mir (1 : Phi est à droite, la tête est éclairée à droite) }
  function grille(p) {
    const g = new Uint8Array(SW * SH);
    const peint = (cal, dy) => { for (const [x, y, c] of cal) { const yy = y + dy; if (yy >= 0 && yy < SH) g[yy * SW + x] = c; } };
    peint(JAMBES[p.jambes], 0);
    peint(CORPS[p.bras], p.acc);
    if (p.detail) peint(ECHARPE, p.acc);
    const dt = p.acc + p.bob;
    peint(TETES[p.mir], dt); peint(COIFFES[p.coiffe], dt);
    const ey = 3 + dt + p.yy;
    for (const x of [4 + p.yx, 6 + p.yx]) {
      g[ey * SW + x] = p.yeux === 'f' ? 2 : 4;
      if (p.yeux === 'g') g[(ey - 1) * SW + x] = 4;
    }
    if (p.goutte) for (const y of [1, 2]) g[(y + p.acc + p.goutte) * SW + 9] = 5;
    // la bouche suit le regard : le visage entier se tourne
    if (p.bouche && p.yy < 1) for (let x = p.bouche === 2 ? 4 : 5; x <= (p.bouche === 2 ? 6 : 5); x++) g[(4 + dt) * SW + x + p.yx] = 4;
    return g;
  }

  // ================================================================ les cent sujets (données fixes)
  const SPRITE = [];
  [[2, 0, 3, 3], [1, 3, 5, 4], [1, 7, 2, 2], [4, 7, 2, 2]].forEach(([x0, y0, w, h]) => { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) SPRITE.push([x, y]); });
  const RF = rng(99);
  const melange = n => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(RF() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const FOULE = [...Array(100).keys()].map(i => ({
    i, cx: 175 + (i % 20) * 50, cy: 360 + Math.floor(i / 20) * 62, r1: RF(), r2: RF(), r3: RF(),
    // cel n'est plus dessiné : ses tirages de RF fixent LOTS, ORDRE, MAUVAIS
    cel: SPRITE.map(([x, y]) => ({ x, y, ph: RF() * 6.283, v: .6 + RF() * .8, g: G[Math.floor(RF() * G.length)], d: (8 - y) / 8 * .45 })),
    // la coiffe (7) et l'écharpe (un sur cinq environ) sont tirées par hache(i), jamais par RF : les tirages de RF (et donc les LOTS) ne bougent pas
    coiffe: Math.floor(hache(i * 7 + 3) * COIFFES.length), detail: hache(i * 17 + 11) < .2 ? 1 : 0,
  }));
  const ensemble = n => new Set(melange(100).slice(0, n));
  const LOTS = { b62: ensemble(62), b40: ensemble(40), b100: ensemble(100), b0: ensemble(0), b25: ensemble(25), b75: ensemble(75) };
  const ORDRE = melange(100);
  const MAUVAIS = new Set(melange(100).slice(0, 13));
  const FOCUS = 47;    // le sujet sur lequel on zoome
  const ABSTIENT = 52; // celui qui ne prend rien

  // ================================================================ état de la scène
  let st, file;            // st : tout ce qui se voit ; file : actions programmées
  let debut = 0, cur = -1; // cur : étape en cours (-1 = ouverture)
  const at = (t, fn) => file.push({ t, fn });
  function vide(jusqua) {
    file.sort((a, b) => a.t - b.t);
    while (file.length && file[0].t <= jusqua) { const it = file.shift(); it.fn(it.t); }
  }
  function etatInitial() {
    file = [];
    st = {
      oeil: { ex: new V(960), ey: new V(420), es: new V(330), a: new V(0), x: new V(0), y: new V(0), r: new V(0), rot: new V(0), glow: new V(.35) },
      // le regard de Phi : les cibles de l'étape (regard), et la saccade en cours (regardPhi) : d'où (px, py) vers où (x, y, ou v : vous)
      regards: [], rg: { px: 960, py: 420, x: 960, y: 420, v: true, t0: -99, d: .1, A: 9, sel: -1, tsel: -99, gx: 0, gy: 0, w: 1 },
      secoue: -99,
      pil: [0, 1].map(i => ({ px: new V(i ? 920 : 380), py: new V(560), ps: new V(.9), a: new V(1), hl: new V(0), t0: Infinity, lab: Infinity, eclat: Infinity })),
      figs: FOULE.map(f => ({ ...f, ta: null, te: null, prev: GRIS_FIG, col: GRIS_FIG, tc: 0, pop: false, td: null, tp: null, tr: null, tck: null, mauvais: false })),
      lueur: -99, vague: -99, chaud: new V(0), clair: new V(0), jauge: new V(0),
      regles: [], reglesA: new V(0), reglesH: new V(0), pulse: -99,
      verifs: null, corrige: null,
      tampon: null, zoom: new V(0), focus: FOCUS, zmode: 'prive', abstient: null,
      dlg: null, dlgOuvre: Infinity,
      quiz: null, choix: null, fin: false,
    };
  }

  // ================================================================ Xphi
  function oeilVers(t, o, d = 1.1) { for (const k in o) st.oeil[k].set(o[k], t, d); }
  // l'humeur donne la forme de l'œil (r, rot, glow) ; son x/y n'est que la pose de la pupille quand Phi vous regarde (voir regardPhi)
  function humeur(t, h) {
    const base = { x: 0, y: 0, r: 12.5, rot: 0, glow: .35 };
    const M = {
      neutre: base,
      grand: { ...base, r: 17, glow: 1 },
      plisse: { x: 0, y: 5, r: 6, rot: -4, glow: .2 },
      doute: { x: -3, y: 2, r: 10, rot: -6, glow: .35 },
      curieux: { x: 5, y: -5, r: 9.5, rot: 9, glow: .4 },
      bas: { ...base, y: 6, r: 11 },
    }[h];
    for (const k in M) st.oeil[k].set(M[k], t, .5);
    if (h === 'grand') st.vague = t;   // Phi s'allume : la vague des regards
  }
  function secoue(t) { st.secoue = t; }
  function cligne(T) {
    const f = d => d < .1 ? 1 - d / .1 : d < .26 ? (d - .1) / .16 : 1;
    return Math.min(f(T % 5.3), f((T + 2.1) % 7.9));
  }
  function dessineOeil(cx, cy, size, s, alpha) {
    if (alpha <= .001 || size <= 0) return;
    const R0 = 12.5, RIN = 31 - 2.6 - .4;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy); ctx.scale(size / 100, size / 100); ctx.translate(-50 + (s.dx || 0), -50);
    ctx.translate(50, 50); ctx.rotate(s.rot * Math.PI / 180); ctx.translate(-50, -50);
    const ox = 50 + s.x, oy = 50 + s.y, r = Math.max(0, s.r);
    const ha = clamp(s.glow, 0, 1) * Math.min(1, r / 6), hr = (6 + 8 * s.glow) * 1.7;
    if (ha > 0) {
      const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, hr);
      g.addColorStop(0, rgba(LABO, .9 * ha)); g.addColorStop(1, rgba(LABO, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ox, oy, hr, 0, Math.PI * 2); ctx.fill();
    }
    ctx.strokeStyle = CRAIE; ctx.lineCap = 'round';
    ctx.lineWidth = 5.2;
    ctx.beginPath(); ctx.arc(50, 50, 31, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(50, 4); ctx.lineTo(50, 17); ctx.moveTo(50, 83); ctx.lineTo(50, 96); ctx.stroke();
    // le diaphragme : six lames qui partent des sommets de l'ouverture et rejoignent l'anneau
    const a0 = -90 + (R0 - r) * 2.6, Vx = [], U = [];
    for (let k = 0; k < 6; k++) { const a = (a0 + 60 * k) * Math.PI / 180; U.push([Math.cos(a), Math.sin(a)]); Vx.push([ox + r * Math.cos(a), oy + r * Math.sin(a)]); }
    ctx.lineWidth = 2.1; ctx.globalAlpha = alpha * .9; ctx.beginPath();
    for (let k = 0; k < 6; k++) {
      const p = (k + 5) % 6; let dx = U[k][0] - U[p][0], dy = U[k][1] - U[p][1]; const L = Math.hypot(dx, dy); dx /= L; dy /= L;
      const [x0, y0] = Vx[k], bx = x0 - 50, by = y0 - 50, b = bx * dx + by * dy, c = bx * bx + by * by - RIN * RIN;
      const t = -b + Math.sqrt(Math.max(0, b * b - c));
      ctx.moveTo(Vx[p][0], Vx[p][1]); ctx.lineTo(x0 + dx * t, y0 + dy * t);
    }
    ctx.stroke(); ctx.globalAlpha = alpha;
    const pr = Math.min(4.2, r * .62);
    if (pr > .05) {
      ctx.fillStyle = LABO; ctx.beginPath(); ctx.arc(ox, oy, pr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(ox + pr * .33, oy - pr * .33, pr * .24, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  function oeil(T) {
    const O = st.oeil, R = st.rg, e = { x: O.x.get(T), y: O.y.get(T), r: O.r.get(T), rot: O.rot.get(T), glow: O.glow.get(T) };
    // le regard (repère de l'écran) ramené dans le repère tourné de l'œil, pour qu'une tête penchée regarde encore juste ;
    // la pose de l'humeur pèse R.w (1 quand Phi vous regarde, 0 dès qu'il regarde quelque chose)
    const [mx, my] = microsaccade(T), gx = R.gx + mx, gy = R.gy + my, a = -e.rot * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
    e.x = e.x * R.w + gx * ca - gy * sa; e.y = e.y * R.w + gx * sa + gy * ca;
    e.r *= cligne(T);
    e.glow += .06 * Math.sin(T * 2.1);
    const k = T - st.secoue; e.dx = k >= 0 && k < .9 ? Math.sin(k * 22) * 3 * (1 - k / .9) : 0;
    dessineOeil(O.ex.get(T), O.ey.get(T) + Math.sin(T * .9) * 4, O.es.get(T), e, O.a.get(T));
  }

  // ---------------------------------------------------------------- Phi suit des yeux
  // Thibaut : « j'ai pas intégré le fait que phi suive des yeux aussi ».
  // Phi regarde un point de la scène (1920×1080). La pupille y va par saccades : un saut de 50 à 150 ms, puis elle tient,
  // avec de petits sauts de fixation ; une cible qui bouge est rattrapée par une nouvelle saccade, jamais par un glissement.
  // La cible, par priorité (cibleRegard) :
  //   1. ce que montre l'étape, regard(t, d, cible) : la plus récente l'emporte, une plus ancienne reprend quand elle finit
  //      (les pilules qui se forment, la foule qui apparaît, saute, s'illumine, meurt, le sujet en gros plan,
  //      la règle qui s'écrit, le tampon, la jauge) ;
  //   2. le geste : la réponse ou la pilule choisie (souris ou clavier), pendant 2,5 s après chaque changement ; même règle,
  //      le plus récent l'emporte : il passe devant les regards de l'étape lancés avant lui (on peut répondre pendant que
  //      la foule saute ou que la jauge tombe : Phi regarde la réponse), et cède à ceux lancés après (la réponse validée,
  //      la pilule qui éclate) ;
  //   3. la souris qui bouge sur la toile ; elle s'efface après 2,5 s d'immobilité ;
  //   4. le repos : des fixations de 0,4 à 2 s, tirées par hache, entre vous, la foule, le texte qui s'écrit, les règles…
  // L'humeur garde la forme de l'œil (r, rot, glow). Son x/y cède la place au regard : c'est la pose de la pupille quand
  // Phi vous regarde (le doute de côté, la curiosité en haut, « bas » les yeux baissés), et elle s'efface dès qu'il regarde
  // quelque chose. Un regard qui tombe juste sur ce qu'il regarde est plus vivant qu'une pose ajoutée qui le fausse.
  // Tout est fonction de T et de st (hache, jamais Math.random) ; seule la saccade en cours (st.rg) dépend des images
  // déjà jouées, et etatInitial la remet à zéro : allerA rejoue juste.
  let souris = null;   // { x, y, t } : le pointeur sur la toile, et quand il a bougé
  const VOUS = () => ({ vous: true });   // vous regarder : la pupille au centre, posée par l'humeur
  const point = (x, y) => () => ({ x, y });
  function regard(t, d, cible, pause = .3) { st.regards.push({ t, d, cible, pause }); st.regards.sort((a, b) => a.t - b.t); }
  // la pupille (unités de l'œil, repère de l'écran) pour regarder (x, y) depuis l'œil en (ex, ey) : un globe qui regarde
  // une scène posée à ZR px devant lui ; A borne l'écart pour que l'ouverture reste dans l'anneau
  const ZR = 220;
  function decalage(x, y, ex, ey, A) {
    const dx = x - ex, dy = y - ey, m = Math.hypot(dx, dy);
    if (m < .001) return [0, 0, 0];
    const k = A / Math.sqrt(m * m + ZR * ZR);
    return [dx * k, dy * k, m];
  }
  // les petits sauts de fixation : toutes les 0,3 à 1,5 s, moins d'une unité ; un saut, pas une dérive
  function microsaccade(T) {
    let n = Math.floor(T / .3);
    for (let j = 0; j < 4 && hache(n * 13 + 7) > .45; j++) n--;
    return [(hache(n * 31 + 1) - .5) * 1.5, (hache(n * 31 + 2) - .5) * 1.5];
  }
  // ce que Phi peut regarder : des fonctions de T qui rendent un point de la scène, VOUS, ou null (rien à voir : on passe)

  }

  // ================================================================ rendu
  function rendu(T) {
    ctx.setTransform(S, 0, 0, S, 0, 0);
    regardPhi(T);
    fond(T);
    terminal(T);
    pilules(T);
    fouleCamera(T);
    jauge(T);
    oeil(T);
    tampon(T);
    cartouche(T);
    regles(T);
    fenetreQuestion(T);
    menuChoix(T);
    dialogue(T);
    voile();
  }

  // ================================================================ lecture et commandes
  const $ = id => document.getElementById(id);
  const temps = () => performance.now() / 1000 - debut;
  function hud() {
    if (cur < 0) { $('etape').innerHTML = '<b>ouverture</b>'; $('prog').style.width = '0%'; $('aide').textContent = ''; return; }
    $('etape').innerHTML = `<b>${String(cur + 1).padStart(2, '0')}/${ETAPES.length}</b> ${ETAPES[cur].nom}`;
    $('prog').style.width = ((cur + 1) / ETAPES.length * 100) + '%';
    let aide = 'espace : suite · ⌫ : retour · R : recommencer';
    if (st.quiz && st.quiz.phase === 'pose') aide = '1–4 ou clic : répondre · ← → puis espace';
    else if (st.choix && st.choix.fait === null) aide = '← → : choisir · espace : valider';
    else if (st.fin) aide = 'R : recommencer';
    $('aide').textContent = aide;
  }
  function boucle() {
    const T = temps();
    if (cur < 0 && T >= 4.4) entre(0, 4.4);
    vide(T);
    rendu(T); hud();
    requestAnimationFrame(boucle);
  }
  function recommence() { debut = performance.now() / 1000; cur = -1; souris = null; etatInitial(); }

  function versToile(e) {
    const r = cv.getBoundingClientRect(), k = Math.min(r.width / W, r.height / H);
    const ox = r.left + (r.width - W * k) / 2, oy = r.top + (r.height - H * k) / 2;
    return [(e.clientX - ox) / k, (e.clientY - oy) / k];
  }
  const dans = (z, x, y) => x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h;
  cv.addEventListener('click', e => {
    cv.focus();
    const T = temps(), [x, y] = versToile(e);
    if (dlgFini(T)) {
      for (const z of zonesQuestion()) if (dans(z, x, y)) { st.quiz.sel = z.i; valideQuestion(T); return; }
      for (const z of zonesChoix()) if (dans(z, x, y)) { selectChoix(T, z.i); confirmeChoix(T); return; }
    }
    suite(T);
  });
  // survol à la souris : la réponse ou la pilule sous le pointeur se met en avant
  cv.addEventListener('mousemove', e => {
    const T = temps(), [x, y] = versToile(e);
    if (x >= 0 && x <= W && y >= 0 && y <= H) souris = { x, y, t: T };   // Phi suit le pointeur
    if (!dlgFini(T)) return;
    for (const z of zonesQuestion()) if (dans(z, x, y)) { st.quiz.sel = z.i; return; }
    for (const z of zonesChoix()) if (dans(z, x, y)) { selectChoix(T, z.i); return; }
  });
  cv.addEventListener('mouseleave', () => { souris = null; });
  const deplace = (s, n, d) => (s < 0 ? (d > 0 ? 0 : n - 1) : (s + d + n) % n);
  addEventListener('keydown', e => {
    const T = temps(), k = e.key;
    const quizOuvert = st.quiz && st.quiz.phase === 'pose', choixOuvert = st.choix && st.choix.fait === null;
    if (k === ' ' || k === 'Enter') { e.preventDefault(); if (!e.repeat) suite(T); }
    else if (quizOuvert && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) {
      e.preventDefault(); st.quiz.sel = deplace(st.quiz.sel, QUESTIONS[st.quiz.qi].opts.length, k === 'ArrowDown' || k === 'ArrowRight' ? 1 : -1);
    }
    else if (quizOuvert && /^[1-4]$/.test(k) && +k <= QUESTIONS[st.quiz.qi].opts.length) {
      if (!dlgFini(T)) st.dlg.t0 = T - st.dlg.n / CPS;
      st.quiz.sel = +k - 1; valideQuestion(T);
    }
    else if (choixOuvert && (k === 'ArrowLeft' || k === 'ArrowRight')) { e.preventDefault(); selectChoix(T, k === 'ArrowLeft' ? 0 : 1); }
    else if (k === 'Backspace') { e.preventDefault(); if (cur > 0) allerA(cur - 1, T); }
    else if (k === 'r' || k === 'R') recommence();
    else if (k === 'c' || k === 'C') $('hud').hidden = !$('hud').hidden;
  });

  const polices = Promise.all([document.fonts.load('34px "DotGothic16"'), document.fonts.load('34px "IBM Plex Mono"'), document.fonts.load('500 26px "IBM Plex Mono"')]);
  Promise.race([polices, new Promise(r => setTimeout(r, 2500))]).catch(() => {}).then(() => {
    prepareTerminal();
    prepareGlyphes();
    recommence();
    const m = location.hash.match(/e(\d+)/); // #e12 : ouvrir directement à l'étape 12
    if (m) { debut -= 8; allerA(+m[1] - 1, temps()); }
    window.__allerA = k => allerA(k, temps());
    window.__suite = () => suite(temps());
    window.__touche = (k) => dispatchEvent(new KeyboardEvent('keydown', { key: k }));
    requestAnimationFrame(boucle);
  });
})();
</script>

</body></html>
