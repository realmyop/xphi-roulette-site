<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sujets expressifs</title>
<style>
/* Planche d'essai pour les cent sujets des « deux pilules » : même toile, même fond, même trame que ../index.html. */
@font-face { font-family: "DotGothic16"; src: url("../fonts/dotgothic16-latin.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url("../fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url("../fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-display: swap; }
:root {
  --nuit: #0c0b0d;
  --craie: #f1e9dc;
  --gris: #8f877b;
  --labo: #8fc0d6;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--nuit); color: var(--craie); overflow: hidden; }
#scene { display: block; width: 100%; height: 100%; object-fit: contain; outline: none; }
#hud {
  position: fixed; right: 16px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  font: 12px/1 var(--mono); letter-spacing: .08em; color: var(--gris); pointer-events: none;
}
#hud b { color: var(--craie); font-weight: 500; }
</style>

<canvas id="scene" width="1920" height="1080" tabindex="0" aria-label="Planche : le nouveau dessin des cent sujets pixelisés, à la taille réelle, agrandis, et dans tous leurs états"></canvas>
<div id="hud"><b>grille</b> 1 choix · 2 vie · 3 peur · 4 mort · 5 privé · 6 sans pilule · 7 isoloir · 0 mélange</div>

<script>
(() => {
  // ================================================================ base (reprise de ../index.html)
  const W = 1920, H = 1080;
  const S = /4k/.test(location.hash) ? 2 : 1;
  const cv = document.getElementById('scene');
  cv.width = W * S; cv.height = H * S;
  const ctx = cv.getContext('2d');

  const CRAIE = '#f1e9dc', GRIS = '#8f877b', NUIT = '#0c0b0d', LABO = '#8fc0d6', LAITON = '#d7a548';
  const BLEU = '#4f86e8', ROUGE = '#d9483b', GRIS_FIG = '#a39a8c';
  const MONO = '"IBM Plex Mono", ui-monospace, monospace';
  const PIX = '"DotGothic16", "IBM Plex Mono", monospace';
  const G = '01·:+*#%xφ'.split('');

  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const lerp = (a, b, k) => a + (b - a) * k;
  const eBack = k => { const c = 1.70158; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  // un nombre fixe dans [0, 1[ pour chaque entier (le premier tirage de rng(n)) : le hasard du sujet, rejouable, sans rien allouer
  const hache = n => { let t = (n | 0) + 0x6D2B79F5 | 0; t = Math.imul(t ^ t >>> 15, 1 | t); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; };
  const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };

  // ================================================================ le sujet : une grille de 11×12 cases, décrite en lettres
  // Une case = 4 px à la taille réelle : 44×48 px, la grille du morceau (pas de 50×62) ne bouge pas.
  // . rien · B le corps (la couleur de sens) · O l'ombre · L la lumière (venue d'en haut, de Phi) · E l'œil, la bouche (la nuit)
  // · G la goutte de sueur (la craie), dans la peur seulement
  // Le corps est un assemblage de calques : jambes, puis corps et bras, puis tête, coiffe, yeux, bouche.
  // Chaque calque est une pose dessinée case par case ; rien n'est copié, tout est donnée.
  const SW = 11, SH = 12, CS = 4;
  const LETTRE = { B: 1, O: 2, L: 3, E: 4, G: 5 }, LETTRES = '·BOLEG';
  const calque = (y0, lignes) => { const out = []; lignes.forEach((l, j) => [...l].forEach((c, x) => { if (LETTRE[c]) out.push([x, y0 + j, LETTRE[c]]); })); return out; };
  const TETE = calque(1, [
    '...LLBBB...',
    '..LBBBBBO..',
    '..BBBBBBO..',
    '..BBBBBBO..',
    '...BBBBO...',
  ]);
  // les coiffes : de l'ombre posée sur la tête, pour qu'on ne soit pas cent clones, sans toucher à la couleur de sens
  const COIFFES = [
    [],                                                                     // ras
    calque(0, ['.....O.....']),                                             // épi
    calque(1, ['...OOOOO...', '..O.....O..']),                              // calot
    calque(0, ['....OOO....', '...OOOOO...']),                              // chignon
    calque(1, ['...OOOOO...', '..O.....O..', '..O.....O..', '..O.....O..']), // longs
  ];
  const CORPS = {
    bas: calque(6, [        // au repos, bras le long du corps
      '....OBO....',
      '...BBBBB...',
      '..O.BBB.O..',
      '..O.BBB.O..',
    ]),
    hop: calque(6, [        // le saut du choix : les bras s'écartent pour l'équilibre
      '....OBO....',
      '.OOBBBBBOO.',
      '....BBB....',
      '....BBB....',
    ]),
    leves: calque(3, [      // la vie : les bras au ciel
      'O.........O',
      'O.........O',
      '.O.......O.',
      '..O.OBO.O..',
      '...BBBBB...',
      '....BBB....',
      '....BBB....',
    ]),
    serres: calque(6, [     // la peur : les bras collés au corps, raide ; plus de jour entre les bras et le ventre
      '....OBO....',
      '...OBBBO...',
      '...OBBBO...',
      '...OBBBO...',
    ]),
    croises: calque(6, [    // celui qui ne prend rien : les bras croisés, large
      '....OBO....',
      '...BBBBB...',
      '..OOOOOOO..',
      '....BBB....',
    ]),
  };
  const JAMBES = {
    droit: calque(10, ['....O.O....', '...OO.OO...']),
    saut: calque(10, ['...O...O...']),
    serre: calque(10, ['.....O.....', '....O.O....']),
  };

  // une image du sujet, case par case. p : { bras, jambes, yx, yy (le regard, -1..1), yeux ('o' ouverts, 'f' fermés, 'g' grands),
  //   bouche (0, 1 un « o », 2 le rire), goutte (0, ou 1..2 : la goutte qui glisse le long de la tempe), bob (la tête descend d'une case : l'expiration), acc (tout le haut descend : accroupi), coiffe }
  function grille(p) {
    const g = new Uint8Array(SW * SH);
    const peint = (cal, dy) => { for (const [x, y, c] of cal) { const yy = y + dy; if (yy >= 0 && yy < SH) g[yy * SW + x] = c; } };
    peint(JAMBES[p.jambes], 0);
    peint(CORPS[p.bras], p.acc);
    const dt = p.acc + p.bob;
    peint(TETE, dt); peint(COIFFES[p.coiffe], dt);
    const ey = 3 + dt + p.yy;
    for (const x of [4 + p.yx, 6 + p.yx]) {
      g[ey * SW + x] = p.yeux === 'f' ? 2 : 4;
      if (p.yeux === 'g') g[(ey - 1) * SW + x] = 4;
    }
    if (p.goutte) for (const y of [1, 2]) g[(y + p.acc + p.goutte) * SW + 9] = 5;
    // la bouche suit le regard : le visage entier se tourne
    if (p.bouche && p.yy < 1) for (let x = p.bouche === 2 ? 4 : 5; x <= (p.bouche === 2 ? 6 : 5); x++) g[(4 + dt) * SW + x + p.yx] = 4;
    return g;
  }

  // ---------------------------------------------------------------- pré-rendu : un atlas de toutes les images déjà vues, par (couleur, image)
  // Chaque image n'est peinte qu'une fois (une case = un pixel), puis drawImage l'agrandit sans lissage :
  // cent sujets = cent drawImage par image, à toutes les échelles (×1, ×4,2 dans l'isoloir, 4K).
  const tons = col => [null, col, mix(col, NUIT, .45), mix(col, CRAIE, .4), '#0c0b0d', CRAIE];
  const ATLAS = document.createElement('canvas'); ATLAS.width = 100 * (SW + 1); ATLAS.height = 60 * (SH + 1);
  const ax = ATLAS.getContext('2d'), CASES = new Map();
  function sprite(col, p) {
    const cle = [col, p.goutte, p.bras, p.jambes, p.yx, p.yy, p.yeux, p.bouche, p.bob, p.acc, p.coiffe].join('|');
    let c = CASES.get(cle);
    if (!c) {
      const n = CASES.size, sx = (n % 100) * (SW + 1), sy = Math.floor(n / 100) * (SH + 1), g = grille(p), T = tons(col);
      g.forEach((v, k) => { if (v) { ax.fillStyle = T[v]; ax.fillRect(sx + k % SW, sy + Math.floor(k / SW), 1, 1); } });
      c = { sx, sy, g, T };
      CASES.set(cle, c);
    }
    return c;
  }
  // les caractères de la dissolution, eux aussi pré-rendus : (couleur, pas vers la craie, glyphe), dessinés à 36 px, posés à 12 px
  const COULEURS = [GRIS_FIG, BLEU, ROUGE], GW = 40;
  let GLY = null;
  function prepareGlyphes() {
    GLY = document.createElement('canvas'); GLY.width = GW * G.length * COULEURS.length; GLY.height = GW * 6;
    const g = GLY.getContext('2d'); g.font = `36px ${MONO}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    COULEURS.forEach((col, ci) => { for (let s = 0; s < 6; s++) { g.fillStyle = mix(col, CRAIE, s / 5); G.forEach((ch, gi) => g.fillText(ch, (ci * G.length + gi) * GW + GW / 2, s * GW + GW / 2)); } });
  }
  const HALOS = new Map();
  function halo(col) {
    if (!HALOS.has(col)) {
      const c = document.createElement('canvas'); c.width = c.height = 80; const g = c.getContext('2d');
      const r = g.createRadialGradient(40, 40, 0, 40, 40, 40); r.addColorStop(0, rgba(col, .45)); r.addColorStop(1, rgba(col, 0));
      g.fillStyle = r; g.fillRect(0, 0, 80, 80); HALOS.set(col, c);
    }
    return HALOS.get(col);
  }

  // ---------------------------------------------------------------- ce que fait le sujet à l'instant T
  function regardeVers(p, c, cx, cy) {
    const dx = c.x - cx, dy = c.y - cy;
    p.yx = Math.abs(dx) > 40 + Math.abs(dy) * .3 ? Math.sign(dx) : 0;
    p.yy = dy < -30 ? -1 : dy > 30 ? 1 : 0;
  }
  // e : { col, mode ('repos'|'saut'|'vie'|'peur'|'rien'|'prive'), t0 (début du saut), k (intensité 0..1),
  //       cible ({x, y} : l'œil de Phi, ou le voisin), fixe (regarde la cible maintenant), dis (0..1 : la dissolution), a (alpha) }
  function pose(f, e, T, cx, cy) {
    const p = { bras: 'bas', jambes: 'droit', yx: 0, yy: 0, yeux: 'o', bouche: 0, goutte: 0, bob: 0, acc: 0, coiffe: f.coiffe };
    let dx = 0, dy = 0;
    // le repos : une case de respiration, un clignement, un regard qui se promène, et parfois les yeux levés vers Phi
    const pr = 2.6 + f.r1 * 1.4; p.bob = (T / pr + f.r2) % 1 < .42 ? 1 : 0;
    const pb = 2.8 + f.r2 * 3.4; if ((T + f.r3 * pb) % pb < .13) p.yeux = 'f';
    const pl = 1.1 + f.r3 * 1.5, n = Math.floor((T + f.r1 * 17) / pl), h = hache(f.i * 7919 + n * 104729);
    let vers = !!e.fixe;
    if (!vers) { if (h < .16) p.yx = -1; else if (h < .32) p.yx = 1; else if (h < .38) p.yy = 1; else if (h < .5) vers = true; }
    if (vers && e.cible) regardeVers(p, e.cible, cx, cy);
    const m = e.mode, k = T - (e.t0 ?? -99), I = e.k ?? 1;
    if (m === 'saut') {          // le choix : on s'accroupit, on saute, la couleur change en l'air, on retombe
      if (k >= -.16 && k < -.04) { p.acc = 1; p.bob = 0; }
      else if (k >= -.04 && k < .3) {
        const u = (k + .04) / .34; dy = -2.4 * Math.sin(Math.PI * u);
        p.bras = 'hop'; p.jambes = u > .15 && u < .85 ? 'saut' : 'droit'; p.bob = 0; p.yx = 0; p.yy = -1;
      }
      else if (k >= .3 && k < .42) { p.acc = 1; p.bob = 0; }
    } else if (m === 'vie') {    // la lueur de vie : bras au ciel, bouche ouverte, petits bonds
      p.bras = 'leves'; p.bouche = 2; p.yy = -1; p.yx = 0; p.bob = 0;
      const u = (T * 1.9 + f.r1) % 1; dy = -1.6 * Math.abs(Math.sin(Math.PI * u)) * I;
      if (u < .08 || u > .92) p.acc = 1; else if (dy < -.8) p.jambes = 'saut';
    } else if (m === 'peur') {   // la rouge l'emporte : raide, accroupi, grands yeux qui cherchent, une goutte de sueur, ça tremble
      const gt = (T * .9 + f.r3) % 1; p.goutte = gt < .4 ? 1 : gt < .75 ? 2 : 0;
      p.bras = 'serres'; p.jambes = 'serre'; p.yeux = p.yeux === 'f' ? 'f' : 'g'; p.bouche = 1; p.bob = 0; p.acc = 1; p.yy = 0;
      p.yx = Math.floor(T * 2.7 + f.r2 * 5) % 2 ? -1 : 1;
      dx = (Math.floor(T * 26 + f.r1 * 9) % 2 ? .25 : -.25) * I;
    } else if (m === 'rien') {   // celui qui ne prend rien : bras croisés, le nez en l'air, il regarde ailleurs
      p.bras = 'croises'; p.yy = -1; p.yx = Math.floor(T / 1.7 + f.r1 * 2) % 2 ? 1 : -1;
    } else if (m === 'prive') {  // en choix privé : on lorgne vers le voisin, sans rien savoir
      if (e.cible) regardeVers(p, e.cible, cx, cy);
      p.yy = 0;
    }
    if (e.dis > 0) { p.yeux = 'f'; p.bouche = 0; p.goutte = 0; }
    return { p, dx, dy };
  }

  // ---------------------------------------------------------------- l'API proposée pour index.html
  // dessineSujet(f, cx, cy, cs, e, T)
  //   f       les données fixes du sujet : FOULE[i] tel quel { i, cx, cy, r1, r2, r3 } + coiffe (0..4, tirée par hache(i)) ;
  //           f.cel ne sert plus : la dissolution tire ses hasards de hache(i, case).
  //   cx, cy  son centre (la grille ne bouge pas : 175 + (i % 20) * 50, 360 + floor(i / 20) * 62) ;
  //           le sprite fait 44×48 px, sommet de la tête à cy - 20, pieds à cy + 24.
  //   cs      la case : 4 à la taille réelle ; × sc pour l'apparition (eBack) ; le zoom de l'isoloir (×4,2)
  //           passe par la transformation du contexte, comme aujourd'hui, et reste net (drawImage sans lissage).
  //   e       son état, recalculé à chaque image dans foule() :
  //     col   couleur(f, T)
  //     mode  'saut'  si f.pop et T dans [f.tc - .2, f.tc + .45], t0 = f.tc : remplace le grossissement « pop »
  //           'vie'   si la lueur (lu > 0) et col ≠ GRIS_FIG, k = lu
  //           'peur'  si col = BLEU et au moins 50 rouges à l'écran (le compte de jauge(), fait une fois par image)
  //           'rien'  pour ABSTIENT quand st.abstient
  //           'prive' pour les voisins en gros plan privé, cible = FOULE[st.focus]
  //           'repos' sinon
  //     cible le point que regardent les yeux levés : l'œil de Phi, { x: st.oeil.ex.get(T), y: st.oeil.ey.get(T) }
  //     fixe  vrai pour lever les yeux vers la cible maintenant (la vague : quand Phi parle, par exemple)
  //     dis   la dissolution, comme aujourd'hui : seg(T, f.td, f.td + 2)
  //     a     fa (le gris à .82, le retour après la mort)
  //   Les signes au-dessus des têtes gardent leur place : « ? » à cy - 32, ✓ à cy - 34, ∅ à cy - 48 et son cercle de 30.
  //   Coût : un drawImage par sujet et par image (au lieu de 35 fillRect) ; pendant la dissolution, un drawImage
  //   par case. L'atlas se remplit à la demande (quelques centaines d'images de 11×12 px en tout).
  function dessineSujet(f, cx, cy, cs, e, T) {
    const a = e.a ?? 1; if (a <= .001) return;
    const { p, dx, dy } = pose(f, e, T, cx, cy);
    const s = sprite(e.col, p), ox = Math.round(cx - SW * cs / 2 + dx * cs), oy = Math.round(cy - SH * cs / 2 + dy * cs), lisse = ctx.imageSmoothingEnabled;
    if (e.mode === 'vie' && !(e.dis > 0)) {
      const r = 40 * cs / CS;
      ctx.globalAlpha = a * (e.k ?? 1) * (.6 + .4 * Math.sin(T * 5 + cx * .01));
      ctx.drawImage(halo(e.col), cx - r, cy - r + dy * cs, 2 * r, 2 * r);
    }
    if (!(e.dis > 0)) {
      ctx.globalAlpha = a; ctx.imageSmoothingEnabled = false;
      ctx.drawImage(ATLAS, s.sx, s.sy, SW, SH, ox, oy, SW * cs, SH * cs);
      ctx.imageSmoothingEnabled = lisse;
      return;
    }
    // la mort, comme dans le morceau : les cases s'envolent en caractères, en partant des pieds
    if (e.dis >= 1) return;
    const ci = Math.max(0, COULEURS.indexOf(e.col)), gs = 12 * cs / CS;
    ctx.imageSmoothingEnabled = true;
    for (let k = 0; k < s.g.length; k++) {
      const v = s.g[k]; if (!v) continue;
      const x = k % SW, y = (k - x) / SW, d = (SH - 1 - y) / (SH - 1) * .45;
      const q = clamp((e.dis * 2 - d) / 1.4, 0, 1); if (q >= 1) continue;
      const hz = hache(f.i * 997 + k * 31), ph = hz * 6.283, vit = .6 + hache(k * 131 + f.i) * .8;
      const px = ox + x * cs + Math.sin(q * 5 + ph) * 14 * q * cs / CS, py = oy + y * cs - Math.pow(q, 1.4) * 170 * vit * cs / CS;
      ctx.globalAlpha = a * (1 - q) * .95;
      if (q > .15) { const gi = Math.floor(hz * 1000) % G.length; ctx.drawImage(GLY, (ci * G.length + gi) * GW, Math.round(q * 5) * GW, GW, GW, px + cs / 2 - gs * .55, py + cs / 2 - gs * .55, gs * 1.1, gs * 1.1); }
      else { ctx.fillStyle = s.T[v]; ctx.fillRect(px, py, cs, cs); }
    }
    ctx.imageSmoothingEnabled = lisse;
  }

  // ================================================================ les cent sujets, à la place exacte du morceau
  const RF = rng(99);
  // coiffe tirée par hache(i) et non par RF : dans index.html, les tirages de RF (et donc les LOTS) ne bougent pas
  const FOULE = [...Array(100).keys()].map(i => ({ i, cx: 175 + (i % 20) * 50, cy: 360 + Math.floor(i / 20) * 62, r1: RF(), r2: RF(), r3: RF(), coiffe: Math.floor(hache(i * 7 + 3) * COIFFES.length) }));
  const melange = (n, R) => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const ORDRE = melange(100, rng(5));
  const lot = (n, seed) => new Set(melange(100, rng(seed)).slice(0, n));
  const FOCUS = 47, ABSTIENT = 52;
  // le mélange de la planche : 40 bleus, 35 rouges, 25 gris
  const MEL = melange(100, rng(17)), COL0 = i => { const r = MEL.indexOf(i); return r < 40 ? BLEU : r < 75 ? ROUGE : GRIS_FIG; };

  // une petite scène sur la grille, avec la même logique que foule() dans index.html
  let figs, gl;
  const couleur = (f, t) => (t < f.tc ? f.prev : f.col);
  function grilleInit() {
    figs = FOULE.map(f => ({ ...f, prev: COL0(f.i), col: COL0(f.i), tc: 0, pop: false, td: null, tr: null }));
    gl = { lueur: -99, mode: 'melange', abstient: null, prive: false, zoom: false };
  }
  function remet(t) { figs.forEach(f => { if (f.td !== null && t >= f.td) f.tr = t; f.td = null; f.prev = couleur(f, t); f.col = GRIS_FIG; f.tc = t + f.r3 * .4; f.pop = false; }); gl.lueur = -99; gl.abstient = null; gl.prive = false; }
  function choisit(t, L, sauf = -1) {
    figs.forEach(f => {
      if (f.i === sauf) { f.prev = f.col = couleur(f, t); f.tc = t; f.pop = false; return; }
      f.prev = couleur(f, t); f.col = L.has(f.i) ? BLEU : ROUGE; f.tc = t + .3 + ORDRE.indexOf(f.i) * .022; f.pop = true;
    });
  }
  function pose0(t, L) { figs.forEach(f => { f.td = null; f.tr = null; f.prev = f.col = L.has(f.i) ? BLEU : ROUGE; f.tc = t; f.pop = false; }); }
  function tue(t, tous = false) { figs.forEach(f => { if (tous || couleur(f, t + 5) === BLEU) f.td = t + f.r2 * 1.0; }); }
  const SCENES = {
    melange: t => { grilleInit(); },
    choix: t => { remet(t); choisit(t + 1.4, lot(62, 3)); },
    vie: t => { remet(t - 9); pose0(t, lot(62, 3)); gl.lueur = t + .2; },
    peur: t => { remet(t - 9); pose0(t, lot(40, 4)); },
    mort: t => { remet(t - 9); pose0(t, lot(40, 4)); tue(t + 1.2); },
    prive: t => { remet(t - 9); figs.forEach(f => { f.tc = 0; }); gl.prive = true; },
    isoloir: t => { remet(t - 9); figs.forEach(f => { f.tc = 0; }); gl.prive = true; gl.zoom = true; },
    rien: t => { remet(t - 9); pose0(t, lot(62, 3)); const a = figs[ABSTIENT]; a.prev = a.col = GRIS_FIG; gl.abstient = t + .3; },
  };

      ctx.restore();
      ctx.globalAlpha = 1; ctx.font = `20px ${PIX}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = CRAIE;
      ctx.fillText(E.nom, x + cw / 2, EY + EHT - 22);
    });
  }

  // ================================================================ rendu
  function rendu(T) {
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.imageSmoothingEnabled = false;
    fond(T);
    foule(T);
    oeil(T);
    legendeGrille();
    cartouche();
    grosPlan(T);
    rangeeEtats(T);
    voile();
  }

  let debut = 0;
  const GEL = location.hash.match(/gel=([\d.]+)/);   // #gel=7.2 : le temps arrêté, pour les captures
  const temps = () => GEL ? +GEL[1] : performance.now() / 1000 - debut;
  function boucle() { rendu(temps()); requestAnimationFrame(boucle); }
  const TOUCHES = { 0: 'melange', 1: 'choix', 2: 'vie', 3: 'peur', 4: 'mort', 5: 'prive', 6: 'rien', 7: 'isoloir' };
  addEventListener('keydown', e => { if (TOUCHES[e.key]) scene(TOUCHES[e.key], temps()); });

  const polices = Promise.all([document.fonts.load('34px "DotGothic16"'), document.fonts.load('34px "IBM Plex Mono"'), document.fonts.load('500 26px "IBM Plex Mono"')]);
  Promise.race([polices, new Promise(r => setTimeout(r, 2500))]).catch(() => {}).then(() => {
    prepareGlyphes();
    debut = performance.now() / 1000;
    grilleInit();
    const m = location.hash.match(/(melange|choix|vie|peur|mort|prive|rien|isoloir)/); // #peur : ouvrir la grille sur une scène
    if (m) scene(m[1], 0);
    window.__grille = nom => scene(nom, temps());
    window.__images = () => CASES.size;
    window.__mesure = (n = 600) => { const t = temps(), t0 = performance.now(); for (let k = 0; k < n; k++) foule(t + k / 60); return +((performance.now() - t0) / n).toFixed(3); }; // ms par image pour les cent sujets
    requestAnimationFrame(boucle);
  });
})();
</script>
