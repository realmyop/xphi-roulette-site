<!doctype html>
<html lang="fr">
<head>

<title>Éditorial — Cran</title>
<link rel="stylesheet" href="../shared/base.css">

<body>
<main class="stage">
  <div class="safe">
    <header class="meta reveal"><span><b>Acte 1</b> · Le barillet</span><span>Cran <span data-cran-n></span> sur 4</span></header>

      <div>
        <p class="risk reveal d2" data-cran-frac></p>
        <p class="risk-phrase reveal d2" data-cran-phrase></p>
        <p class="story reveal d3">La personne vise le berceau. Que fait‑elle&nbsp;?</p>
        <div class="push"></div>
        <div class="choices reveal d4">
          <button class="btn">Tirer</button>
          <button class="btn">Ne pas tirer</button>
        </div>
      </div>
    </div>

    <div class="push"></div>
    <div class="ladder reveal d4" data-ladder></div>
  </div>
</main>
