<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Éditorial — Accueil</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
<script src="../shared/mockup.js"></script>
</head>
<body>
<main class="stage">
  <div class="safe">
    <header class="meta reveal"><span><b>Xphi</b> · Expérience n° 1</span><span>8 à 10 min</span></header>

    <div class="byline reveal d1">
      <span data-phi="malicieux"></span>
      <span><b>Phi</b>votre narrateur</span>
    </div>

    <p class="say reveal d2">Je vais vous raconter une histoire. <span class="soft">À certains moments, c’est vous qui déciderez.</span></p>
    <p class="aside reveal d3">Il n’y a pas de bonne réponse, seulement la vôtre.</p>

    <div class="push"></div>
    <div class="reveal d4">
      <button class="btn solid start">Commencer</button>
      <p class="note">Anonyme · sans compte · 16 ans et plus</p>
    </div>
  </div>
</main>
</body>
</html>
