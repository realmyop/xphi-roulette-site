<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0b0d">
<title>Xphi — Le barillet</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="cinema.css">
<script src="../shared/mockup.js"></script>
<script src="../shared/oeil.js"></script>
<script type="module" src="main.js"></script>
</head>
<body>
<main class="stage cinema">
  <div class="frame">
    <canvas id="film" aria-label="Le film de l’Acte 1"></canvas>
    <div class="wait" hidden><span></span></div>
  </div>
  <div class="dock">
    <div class="sub">
      <span class="phi-mini" data-expr="neutre" aria-hidden="true"></span>
      <p id="sub-text" aria-live="polite"></p>
    </div>
    <div class="choices" hidden>
      <button class="choice" type="button"></button>
      <button class="choice" type="button"></button>
    </div>
    <div class="oeil-choix" aria-hidden="true" hidden></div>
    <div class="oeil-vivant" aria-hidden="true"></div>
    <p class="note" hidden></p>
    <nav class="endlinks" hidden></nav>
  </div>
</main>
<div class="debug" hidden></div>
</body>
</html>
