<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadran — Accueil</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
<script src="../shared/mockup.js"></script>
</head>
<body>
<main class="stage">
  <div class="safe">
    <div class="push"></div>
    <div class="face big reveal d1" data-phi="malicieux"></div>
    <p class="hello reveal d1">Bonjour. Je suis Phi.</p>
    <p class="speech reveal d2">Je vais vous raconter une histoire. <em>À certains moments, c’est vous qui déciderez.</em></p>
    <p class="speech aside reveal d3">Il n’y a pas de bonne réponse, seulement la vôtre.</p>
    <div class="push"></div>
    <div class="reveal d4">
      <button class="pill solid">Commencer</button>
      <p class="note">8 à 10 minutes · anonyme · 16 ans et plus</p>
    </div>
  </div>
</main>
</body>
