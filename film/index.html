<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xphi — Acte 1, le film</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="film.css">
<script src="../shared/mockup.js"></script>
<script type="module" src="main.js"></script>
</head>
<body>
<main class="stage film">
  <div class="viewport">
    <svg id="scene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <svg id="insert" viewBox="-540 -540 1080 1080" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
  </div>
  <div class="dock">
    <div class="sub">
      <span class="phi-mini" data-expr="neutre" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="60" cy="62" r="38"/><path d="M60 8 L60 116"/>
          <g class="x-neutre"><circle cx="47" cy="56" r="3.2" fill="currentColor" stroke="none"/><circle cx="73" cy="56" r="3.2" fill="currentColor" stroke="none"/><path class="mouth" d="M48 78 Q60 82 72 78"/></g>
          <g class="x-curieux"><circle cx="47" cy="57" r="3.2" fill="currentColor" stroke="none"/><circle cx="73" cy="56" r="4.6"/><path d="M66 44 L80 40"/><path d="M41 47 L53 47"/><ellipse class="mouth" cx="60" cy="80" rx="4" ry="4.6"/></g>
          <g class="x-malicieux"><path d="M42 57 Q47 53 52 57"/><path d="M68 57 Q73 53 78 57"/><path d="M66 45 L80 48"/><path class="mouth" d="M46 76 Q58 86 74 74"/></g>
          <ellipse class="talk-mouth" cx="60" cy="79" rx="7" ry="5.5"/>
        </svg>
      </span>
      <p id="sub-text" aria-live="polite"></p>
    </div>
    <div class="choices" hidden>
      <button class="choice" type="button"></button>
      <button class="choice" type="button"></button>
    </div>
    <nav class="endlinks" hidden></nav>
  </div>
</main>
<div class="debug" hidden></div>
</body>
</html>
