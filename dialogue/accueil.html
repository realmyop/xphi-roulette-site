<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dialogue — Accueil</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
<script src="../shared/mockup.js"></script>
</head>
<body>
<main class="stage">
  <div class="safe">
    <div class="top reveal"><span><b>Xphi</b> · expérience n° 1</span><span>8 à 10 min</span></div>
    <div class="scene">
      <div class="narrator reveal d1"><span data-phi="malicieux" data-body></span><span class="name">Phi <span>· narrateur</span></span></div>
      <div class="lines">
        <p class="line old reveal d1">Bonjour.</p>
        <p class="line old reveal d2">Je vais vous raconter une histoire. À certains moments, c’est vous qui déciderez.</p>
        <p class="line reveal d3">Il n’y a pas de bonne réponse, seulement la vôtre.</p>
      </div>
      <div class="push"></div>
      <div class="replies reveal d4"><button class="reply solid">Commencer</button></div>
      <p class="note reveal d4">Anonyme · sans compte · 16 ans et plus</p>
    </div>
  </div>
</main>
</body>
</html>
