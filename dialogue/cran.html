<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dialogue — Cran</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
<script src="../shared/mockup.js"></script>
</head>
<body>
<main class="stage">
  <div class="safe">
    <div class="top reveal"><span><b>Acte 1</b> · le barillet</span><span><span data-cran-n></span> / 4</span></div>
    <div class="scene">
      <div class="narrator reveal"><span data-phi="curieux" data-body></span><span class="name">Phi</span></div>
      <div class="lines">
        <p class="line old reveal d1">La personne revient avec un autre barillet.</p>
        <div class="card reveal d2">
          <div data-barillet></div>
          <div><div class="risk" data-cran-frac></div><div class="risk-phrase" data-cran-phrase></div></div>
        </div>
        <p class="line after-card reveal d3">Elle vise le berceau. Que fait‑elle&nbsp;?</p>
      </div>
      <div class="push"></div>
      <div class="replies reveal d4">
        <button class="reply">Tirer</button>
        <button class="reply">Ne pas tirer</button>
      </div>
    </div>
  </div>
</main>
