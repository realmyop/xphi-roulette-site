<main class="stage">
  <div class="safe">
    <div class="top reveal"><span><b>Résultats</b> · l’asymétrie</span><span class="fake-data">Données fictives</span></div>
    <div class="scene compact">
      <div class="narrator reveal"><span data-phi="malicieux" data-body></span><span class="name">Phi</span></div>
      <div class="lines">
        <p class="line old reveal d1">À votre avis&nbsp;: où chacun s’arrête‑t‑il&nbsp;?</p>
        <p class="line reveal d3">À risque égal, on refuse de tirer bien plus tôt qu’on ne renonce à concevoir.</p>
      </div>
      <div class="chart-wrap reveal d2" data-chart
           data-chart-phone='{"w":360,"h":280,"font":11}'
           data-chart-screen='{"w":1100,"h":470,"font":20}'></div>
      <p class="note reveal d3">Part des joueurs ayant déjà refusé, cran après cran · 2 000 parcours fictifs · en vert, le vôtre</p>
    </div>
  </div>
